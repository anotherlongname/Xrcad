<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XrCAD</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw !important; height: 100vh !important; }
      #vr-button-container {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
      }
      #stl-prep {
        position: fixed;
        bottom: 72px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: monospace;
        font-size: 13px;
      }
      #stl-prep-btn {
        background: #0f172a;
        color: #e0e8ff;
        border: 1px solid #1e3a6a;
        padding: 7px 14px;
        cursor: pointer;
        font-family: monospace;
        font-size: 13px;
        white-space: nowrap;
      }
      #stl-prep-btn:hover { background: #1e2d5a; border-color: #3b5bdb; }
      #stl-prep-status { color: #64748b; }
      #stl-prep-status.ready { color: #4ade80; }
    </style>
  </head>
  <body>
    <div id="vr-button-container"></div>
    <div id="stl-prep">
      <button id="stl-prep-btn">Prepare STL for VR</button>
      <span id="stl-prep-status">Select an STL before entering VR</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
