<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XrCAD</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw !important; height: 100vh !important; }
      #vr-button-container {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
      }
      #file-ops {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 8px;
        font-family: monospace;
      }
      #file-ops button {
        background: #0f172a;
        color: #e0e8ff;
        border: 1px solid #1e3a6a;
        padding: 7px 14px;
        cursor: pointer;
        font-family: monospace;
        font-size: 13px;
        white-space: nowrap;
      }
      #file-ops button:hover { background: #1e2d5a; border-color: #3b5bdb; }
    </style>
  </head>
  <body>
    <!-- dom-overlay root: transparent when idle, shown over XR view during a session -->
    <div id="xr-overlay" style="position:fixed;inset:0;pointer-events:none;z-index:100;"></div>
    <div id="file-ops">
      <button id="file-ops-save">SAVE</button>
      <button id="file-ops-load">LOAD .XRCAD</button>
      <button id="file-ops-stl">IMPORT STL</button>
      <button id="file-ops-export-stl">EXPORT STL</button>
    </div>
    <div id="vr-button-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
