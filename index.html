<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XrCAD</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw !important; height: 100vh !important; }
      #vr-button-container {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
      }
      #stl-prep {
        position: fixed;
        bottom: 72px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: monospace;
        font-size: 13px;
      }
      #stl-prep-btn {
        background: #0f172a;
        color: #e0e8ff;
        border: 1px solid #1e3a6a;
        padding: 7px 14px;
        cursor: pointer;
        font-family: monospace;
        font-size: 13px;
        white-space: nowrap;
      }
      #stl-prep-btn:hover { background: #1e2d5a; border-color: #3b5bdb; }
      #stl-prep-status { color: #64748b; }
      #stl-prep-status.ready { color: #4ade80; }
    </style>
  </head>
  <body>
    <!-- dom-overlay root — must be present at session-request time; transparent when idle -->
    <div id="xr-overlay" style="position:fixed;inset:0;pointer-events:none;z-index:100;">
      <div id="xr-import-panel"
           style="display:none; pointer-events:auto; position:absolute;
                  bottom:80px; left:50%; transform:translateX(-50%);
                  background:#111827; border:1px solid #1e3a6a;
                  padding:20px 24px; font-family:monospace; color:#e0e8ff;
                  text-align:center; min-width:260px; z-index:101;">
        <div style="margin-bottom:14px;font-size:15px;">Select an STL file</div>
        <label style="display:block; background:#0f172a; border:1px solid #3b5bdb;
                      padding:10px 20px; cursor:pointer; margin-bottom:10px; font-size:14px;">
          Browse&hellip;
          <input id="xr-file-input" type="file" accept=".stl" style="display:none;">
        </label>
        <button id="xr-import-cancel"
                style="background:none; border:1px solid #1e3a6a; padding:6px 14px;
                       color:#64748b; cursor:pointer; font-family:monospace; font-size:13px;">
          Cancel
        </button>
      </div>
    </div>
    <div id="vr-button-container"></div>
    <div id="stl-prep">
      <button id="stl-prep-btn">Prepare STL for VR</button>
      <span id="stl-prep-status">Select an STL before entering VR</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
